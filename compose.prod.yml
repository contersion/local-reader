services:
  reader:
    image: hectorqin/reader:openj9-latest
    container_name: reader
    restart: unless-stopped
    depends_on:
      - readerwebview
    ports:
      - "${READER_HOST_PORT:-18080}:8080"
    volumes:
      - "${READER_LOGS_DIR:-./docker/reader/logs}:/logs"
      - "${READER_STORAGE_DIR:-./docker/reader/storage}:/storage"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SPRING_PROFILES_ACTIVE: prod
      READER_APP_USERLIMIT: "${READER_APP_USERLIMIT:-50}"
      READER_APP_USERBOOKLIMIT: "${READER_APP_USERBOOKLIMIT:-200}"
      READER_APP_CACHECHAPTERCONTENT: "${READER_APP_CACHECHAPTERCONTENT:-true}"
      READER_APP_REMOTEWEBVIEWAPI: "http://readerwebview:8050"
      READER_APP_SECURE: "true"
      READER_APP_SECUREKEY: "${READER_APP_SECUREKEY}"
      READER_APP_INVITECODE: "${READER_APP_INVITECODE}"
      READER_APP_AUTOCLEARINACTIVEUSER: "${READER_APP_AUTO_CLEAR_INACTIVE_USER_DAYS:-0}"
      READER_APP_DEBUGLOG: "${READER_APP_DEBUGLOG:-false}"
    networks:
      - reader_net

  readerwebview:
    image: hectorqin/remote-webview:latest
    container_name: readerwebview
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    networks:
      - reader_net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --api-version
      - "${WATCHTOWER_API_VERSION:-1.53}"
      - --cleanup
      - --schedule
      - "${WATCHTOWER_SCHEDULE:-0 0 4 * * *}"
      - reader
      - readerwebview
      - watchtower
    networks:
      - reader_net

networks:
  reader_net:
    driver: bridge
